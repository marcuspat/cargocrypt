[package]
name = "cargocrypt-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
cargocrypt = { path = ".." }

# Not part of the parent crate's build.
[workspace]

[[bin]]
name = "container_parse"
path = "fuzz_targets/container_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream_decrypt"
path = "fuzz_targets/stream_decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scan_content"
path = "fuzz_targets/scan_content.rs"
test = false
doc = false
bench = false
