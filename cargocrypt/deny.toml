# cargo-deny configuration. Run: cargo deny check
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory, including unmaintained crates. Exceptions go
# in `ignore`, each with the reason it does not apply.
unmaintained = "all"
yanked = "deny"
ignore = [
    # bincode 1.x is unmaintained. It is kept only to read version 1
    # containers and existing git-storage blobs; nothing new is written with
    # it. Removing it means dropping v1 read support.
    { id = "RUSTSEC-2025-0141", reason = "needed to read legacy v1 containers" },
]

[licenses]
# Permissive licences only; the crate itself is MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io only: no git dependencies, no alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
