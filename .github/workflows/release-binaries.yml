name: Release binaries

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  # To (re-)release an EXISTING tag, dispatch with the tag as the ref:
  #   gh workflow run release-binaries.yml --ref v0.2.10
  # Starting a dispatch from a branch fails fast in `verify`.
  workflow_dispatch:

permissions:
  contents: read

# Two runs for the same tag (push + manual) must not race the release.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CYCLONEDX_VERSION: "0.5.9"

jobs:
  verify:
    name: Verify the tag builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch must run on a tag
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        run: |
          echo "::error::start the dispatch with the tag as the ref: gh workflow run release-binaries.yml --ref <tag>" >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cargocrypt

      # Fail fast on a tag that does not compile before burning matrix minutes.
      - name: cargo build (host)
        working-directory: cargocrypt
        run: cargo build --release --locked

  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: verify
    # PRs stop at `verify` (one host build): the 4-target matrix incl. two
    # macOS runners only burns minutes on tag pushes and tag dispatches.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write # sign the provenance attestation (Sigstore, keyless)
      attestations: write # store it against the repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - name: Dispatch must run on a tag
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        run: |
          echo "::error::start the dispatch with the tag as the ref: gh workflow run release-binaries.yml --ref <tag>" >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cargocrypt
          key: ${{ matrix.target }}

      - name: Install musl tooling
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # The crate lives in cargocrypt/ (no root manifest): build from there,
      # keep dist/ at the workspace root so `uses:` steps (attest, upload)
      # see the same relative paths.
      - name: Build
        working-directory: cargocrypt
        run: cargo build --release --locked --target ${{ matrix.target }} --bin cargocrypt

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "cargocrypt/target/${{ matrix.target }}/release/cargocrypt" "dist/cargocrypt-${{ matrix.target }}"
          cd dist
          shasum -a 256 "cargocrypt-${{ matrix.target }}" > "cargocrypt-${{ matrix.target }}.sha256"

      # CycloneDX SBOM of exactly the dependency set compiled into this
      # target's binary, published next to it.
      - name: Generate SBOM
        shell: bash
        working-directory: cargocrypt
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --locked --version "${CYCLONEDX_VERSION}"
          cargo cyclonedx --format json --describe binaries --target "${{ matrix.target }}" --target-in-filename
          set -- cargocrypt_bin_${{ matrix.target }}.cdx.json
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "expected exactly one SBOM for ${{ matrix.target }}, got: $*" >&2
            exit 1
          fi
          cp "$1" "$GITHUB_WORKSPACE/dist/cargocrypt-${{ matrix.target }}.cdx.json"

      # SLSA build provenance: binds the binary's digest to this workflow run
      # and commit.
      # Attestations name the RUN's ref/sha, so only sign when the run is
      # the tag itself: a tag push, or a dispatch started with
      #   gh workflow run release-binaries.yml --ref vX.Y.Z
      # (a dispatch from a branch would otherwise attest that branch's sha,
      # not the tag actually built). Never on pull_request: fork PRs have no
      # OIDC and unmerged code shouldn't be attested.
      - name: Attest build provenance
        if: github.event_name != 'pull_request' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/cargocrypt-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargocrypt-${{ matrix.target }}
          path: dist/

  release:
    name: Attach to GitHub Release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: binaries
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: cargocrypt ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
